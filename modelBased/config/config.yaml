domain: crafter  # crafter | minigrid | bipedalwalker

pipeline:
  label: ${domain}  # minigrid | crafter | bipedalwalker | full
  force: false
  force_policy: false  # Retrain only policy; keep the matching dataset and WM.
  skip_world_model: false  # Reuse the configured WM; fail if it is missing.
  skip_policy: false

domains:
  crafter:
    env_type: crafter
    task_name: crafter_progression_small
    data_collection:
      # Per-episode environment cap used while collecting WM transitions.
      # Match the policy horizon so rare long-range interactions can appear
      # in the collected transitions before death or dataset-cap stopping.
      max_steps: 4096
      data_type: random
      episodes: 1000
      mini_dataset_size: 8000
      maximum_dataset_size: 100000
      uniform_reset_steps: 5000
    policy:
      # The current progression layout is compact but its resources are spread
      # out; allow PPO enough horizon for inefficient exploratory trajectories.
      max_ep_len: 4096
      # 8192 / 8 imagined environments = 1024 temporal steps per update.
      rollout_steps: 8192
      num_imagined_envs: 64
      max_training_timesteps: 3000000
      total_test_episodes: 100
    grid_shape: [2, 0, 0]
    attention_mask_size: 5
    obs_norm_values: [20, 5, 0]
    action_norm_values: 17
    # Canonical layout source. Data collection, WM identity checks and policy
    # environment configuration all reference this single field.
    layout_path: ${oc.env:ENV_PATH}/crafter/${domains.crafter.task_name}.txt
    data_save_path: ${oc.env:TRAIN_DATASET_PATH}/crafter_${domains.crafter.task_name}_${env.collect.data_type}.npz
    # Used only when continual_learning=false and p2e.enabled=true.
    p2e_data_save_path: ${oc.env:TRAIN_DATASET_PATH}/crafter_${domains.crafter.task_name}_p2e.npz
    # The map head predicts KEEP/SET_TO categorical effects and inventory is
    # a numerical delta. Keep this artifact separate from absolute-map WMs.
    # Standard single-run WM. Continual training writes its separate final
    # artifact to continual_learning.final_checkpoint below.
    world_model_checkpoint: ${oc.env:MODEL_FPATH}/AttentionWM/attention_world_model_crafter_${domains.crafter.task_name}_effect.ckpt
    # Existing Crafter validation files use different map shapes/layouts.
    # Re-enable this after collecting a validation split for this layout.
    validation_data_dir: null
    continual_learning:
      # The normal pipeline remains single-environment unless explicitly enabled.
      enabled: False
      resume: False
      allow_legacy_dataset: false
      state_path: ${oc.env:MODEL_FPATH}/AttentionWM/continual_crafter_${domains.crafter.task_name}_continue_effect_state.pt
      replay_path: ${oc.env:MODEL_FPATH}/AttentionWM/continual_crafter_${domains.crafter.task_name}_continue_effect_replay.pt
      final_checkpoint: ${oc.env:MODEL_FPATH}/AttentionWM/attention_world_model_crafter_${domains.crafter.task_name}_continue_effect.ckpt
      metrics_path: ${oc.env:MODEL_FPATH}/AttentionWM/continual_crafter_${domains.crafter.task_name}_continue_effect_metrics.csv
      # P2E acquisition has separate resumable state and final artifacts.
      p2e_state_path: ${oc.env:MODEL_FPATH}/AttentionWM/continual_crafter_${domains.crafter.task_name}_p2e_continue_effect_state.pt
      p2e_replay_path: ${oc.env:MODEL_FPATH}/AttentionWM/continual_crafter_${domains.crafter.task_name}_p2e_continue_effect_replay.pt
      p2e_final_checkpoint: ${oc.env:MODEL_FPATH}/AttentionWM/attention_world_model_crafter_${domains.crafter.task_name}_p2e_continue_effect.ckpt
      p2e_metrics_path: ${oc.env:MODEL_FPATH}/AttentionWM/continual_crafter_${domains.crafter.task_name}_p2e_continue_effect_metrics.csv
      # A completed final artifact is authoritative. Set pipeline.force=true
      # when a fresh continual run is intentionally required.
      skip_if_final_checkpoint_exists: true
      keep_phase_checkpoints: false
      # One global collection budget. The collector divides it automatically
      # across however many phases are configured, including a remainder.
      total_collection_steps: ${domains.crafter.data_collection.maximum_dataset_size}
      required_phase_count: null
      collect_data: true
      force_collection: false
      replay_buffer_size: 100000
      replay_frac: 0.5
      current_sample_ratio: 0.3
      salient_sample_ratio: 0.5
      fisher_samples: 3000
      fisher_beta: 0.5
      validate_after_each_phase: true
      # The default task stays unchanged. Later phases overlap adjacent
      # progression boundaries and use separate layouts only when a crafting
      # station must already be present for random collection to exercise the
      # next recipe reliably. total_collection_steps is divided by the actual
      # number of configured phases.
      # Each dataset must contain matching identity metadata unless legacy mode
      # is explicitly enabled above.
      phases:
        - name: progression_small
          task_name: crafter_progression_small
          layout_path: ${oc.env:ENV_PATH}/crafter/crafter_progression_small.txt
          data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_default_random.npz
          p2e_data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_default_p2e.npz
          initial_inventory: {}
          validation_data_dir: null
        - name: wood_ready
          task_name: crafter_progression_small
          layout_path: ${oc.env:ENV_PATH}/crafter/crafter_progression_small.txt
          data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_wood_ready_random.npz
          p2e_data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_wood_ready_p2e.npz
          # Enough wood to place a table and craft one wooden tool, but do not
          # grant the tool itself: this phase learns the default->wood bridge.
          initial_inventory: {health: 9, food: 9, drink: 9, energy: 9, wood: 3}
          validation_data_dir: null
        - name: stone_ready
          task_name: crafter_progression_small
          layout_path: ${oc.env:ENV_PATH}/crafter/crafter_progression_small_stone_ready.txt
          data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_stone_ready_random.npz
          p2e_data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_stone_ready_p2e.npz
          # A nearby table makes stone recipes observable. Stone also covers
          # furnace placement; the wooden pickaxe preserves the prior-stage
          # prerequisite instead of jumping directly to a stone tool.
          initial_inventory: {health: 9, food: 9, drink: 9, energy: 9, wood: 3, stone: 5, coal: 2, wood_pickaxe: 1}
          validation_data_dir: null
        - name: iron_ready
          task_name: crafter_progression_small
          layout_path: ${oc.env:ENV_PATH}/crafter/crafter_progression_small_iron_ready.txt
          data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_iron_ready_random.npz
          p2e_data_dir: ${oc.env:TRAIN_DATASET_PATH}/crafter_crafter_progression_small_inv_iron_ready_p2e.npz
          # Table and furnace are present in this phase layout. Give the
          # ingredients and a stone pickaxe, not the iron pickaxe, so the data
          # contains make_iron_pickaxe before collect_diamond.
          initial_inventory: {health: 9, food: 9, drink: 9, energy: 9, wood: 3, stone: 4, coal: 2, iron: 2, stone_pickaxe: 1}
          validation_data_dir: null
    visualize_filename: ${domains.crafter.task_name}_${env.collect.data_type}_coverage.png
    env_visualize_filename: ${domains.crafter.task_name}_${env.collect.data_type}_env.png
    use_bipedal_attention: false
    # Same generic sampler used by MiniGrid: balance only action and whether
    # any observed state changed, never resource/object identities.
    transition_balanced_sampling: true
    wm_data_type: discrete
    observation_schema:
      - {name: layout_object_effect, distribution: categorical_effect, prediction_slice: [0, 21], target_index: 0, classes: 20, label_smoothing: 0.0}
      - {name: layout_direction_effect, distribution: categorical_effect, prediction_slice: [21, 27], target_index: 1, classes: 5, label_smoothing: 0.0}
      - {name: inventory, distribution: symlog_mse, prediction_source: auxiliary, target_source: inventory, target_mode: delta}
    # Policy-specific settings for Crafter WM planning:
    # Object ID of the "success" tile (diamond=10 for minitask_01).
    success_obj_id: 10
    # Inventory vector dimension (health/food/drink/energy + 12 items = 16).
    inventory_dim: 16
    reward_mode: native_crafter
    planning_start: episode_initial
    target_tile_eval: true

  minigrid:
    env_type: minigrid
    task_name: Grid_11_11_KD_level3
    data_collection:
      max_steps: 5000
      data_type: random
      episodes: 1000
      mini_dataset_size: 8000
      maximum_dataset_size: 60000
      uniform_reset_steps: 5000
    policy:
      max_ep_len: 1000
      rollout_steps: 4096
      max_training_timesteps: 1536000
      total_test_episodes: 1000
    grid_shape: [3, 0, 0]
    attention_mask_size: 3
    obs_norm_values: [10, 5, 3]
    action_norm_values: 6  # Compact IDs 0..5; native done (6) is excluded.
    # Canonical layout source. Normally only task_name needs to change.
    layout_path: ${oc.env:ENV_PATH}/minigrid/${domains.minigrid.task_name}.txt
    data_save_path: ${oc.env:TRAIN_DATASET_PATH}/minigrid_${domains.minigrid.task_name}_inventory_v1_${env.collect.data_type}.npz
    world_model_checkpoint: ${oc.env:MODEL_FPATH}/AttentionWM/attention_world_model_minigrid_${domains.minigrid.task_name}_inventory_v1.ckpt
    validation_data_dir: null
    visualize_filename: ${domains.minigrid.task_name}_${env.collect.data_type}_coverage.png
    env_visualize_filename: ${domains.minigrid.task_name}_${env.collect.data_type}_env.png
    use_bipedal_attention: false
    transition_balanced_sampling: true
    wm_data_type: discrete
    observation_schema:
      - {name: object, distribution: categorical, prediction_slice: [0, 11], target_index: 0, target_mode: current_plus_delta, classes: 11}
      - {name: color, distribution: categorical, prediction_slice: [11, 17], target_index: 1, target_mode: current_plus_delta, classes: 6}
      - {name: state, distribution: categorical, prediction_slice: [17, 21], target_index: 2, target_mode: current_plus_delta, classes: 4}
      - {name: inventory, distribution: categorical, prediction_source: auxiliary, target_source: inventory, classes: 7}
    collection_replace_start_with_empty: false

  bipedalwalker:
    env_type: bipedalwalker
    task_group: target # target/minitask
    task_folder: target_tasks # target_tasks/minitasks
    task_name: bipedal_target_task_16
    world_model_checkpoint: ${oc.env:MODEL_FPATH}/AttentionWM/attention_world_model_bipedalwalker_${domains.bipedalwalker.task_name}.ckpt
    validation_task_group: target
    validation_task_folder: target_tasks
    validation_task_name: target_env_stump_1
    data_collection:
      max_steps: 1600
      data_type: random
      episodes: 1000
      mini_dataset_size: 8000
      maximum_dataset_size: 60000
      uniform_reset_steps: 5000
    policy:
      max_ep_len: 1600
      rollout_steps: 4096
      max_training_timesteps: 1536000
      total_test_episodes: 1000
    grid_shape: [1, 1, 24]
    attention_mask_size: 5
    obs_norm_values: [1]
    action_norm_values: 4
    # Canonical layout source. Data collection and downstream stages reuse it.
    layout_path: ${oc.env:ENV_PATH}/bipedalwalker/${domains.bipedalwalker.task_folder}/${domains.bipedalwalker.task_name}.txt
    data_save_path: ${oc.env:TRAIN_DATASET_PATH}/bipedalwalker_${domains.bipedalwalker.task_group}_${domains.bipedalwalker.task_name}_${env.collect.data_type}.npz
    validation_data_dir: ${oc.env:TRAIN_DATASET_PATH}/bipedalwalker_${domains.bipedalwalker.validation_task_group}_${domains.bipedalwalker.validation_task_name}_${env.collect.data_type}.npz
    visualize_filename: ${domains.bipedalwalker.task_name}_coverage.png
    env_visualize_filename: ${domains.bipedalwalker.task_name}_env.png
    bipedal_prior_weight: 0.5  # 30% prior weight for heuristic vs random noise
    behavior_policy: heuristic # heuristic | pretrained_sb3
    sb3_algo: SAC
    sb3_model_path: null
    sb3_noise_std: 0.15
    sb3_deterministic: false
    wm_data_type: norm
    use_bipedal_attention: true
    transition_balanced_sampling: false
    observation_schema:
      - {name: hull_pose, distribution: mse, indices: [0, 1]}
      - {name: hull_vel, distribution: mse, indices: [2, 3]}
      - {name: leg1_hip, distribution: mse, indices: [4, 5]}
      - {name: leg1_knee, distribution: mse, indices: [6, 7]}
      - {name: leg1_contact, distribution: bernoulli, indices: [8], prediction_source: contact_logits, target_mode: current_plus_delta}
      - {name: leg2_hip, distribution: mse, indices: [9, 10]}
      - {name: leg2_knee, distribution: mse, indices: [11, 12]}
      - {name: leg2_contact, distribution: bernoulli, indices: [13], prediction_source: contact_logits, target_mode: current_plus_delta}
      - {name: lidar_near, distribution: mse, indices: [14, 15, 16, 17, 18]}
      - {name: lidar_far, distribution: mse, indices: [19, 20, 21, 22, 23]}

# Plan2Explore acquisition for Crafter WM datasets. P2E alternates short real
# collection rounds with updates to a transient WM, disagreement ensemble and
# intrinsic-reward PPO explorer. The canonical continual WM is trained on the
# resulting datasets afterwards.
p2e:
  enabled: true
  # One 4k random bootstrap plus 24 P2E chunks keeps the single-layout
  # collection budget at exactly 100k transitions.
  cycles_per_phase: 24
  bootstrap_steps: 4000
  bootstrap_wm_epochs: 10
  bootstrap_disag_epochs: 5
  num_models: 10
  intrinsic_reward_scale: 1.0
  # Disagreement remains the main P2E signal. The small task-aware terms only
  # prevent curiosity from preferring fatal or non-progressing trajectories.
  intrinsic_disagreement_weight: 1.0
  intrinsic_progression_weight: 0.25
  intrinsic_survival_weight: 0.05
  intrinsic_death_penalty: 0.5
  intrinsic_disagreement_clip: 5.0
  disag_lr: 1.0e-4
  disag_epochs: 1
  batch_size: 256
  encode_batch_size: 512
  target_type: delta
  bootstrap_heads: true
  inventory_scale: 9.0
  imagined_batch_size: 64
  imagined_horizon: 15
  imagined_batches_per_cycle: 4
  ppo_lr_actor: 3.0e-4
  ppo_lr_critic: 1.0e-3
  ppo_gamma: 0.99
  ppo_k_epochs: 2
  ppo_eps_clip: 0.2
  ppo_entropy_coef: 0.03
  ppo_normalize_advantages: true
  ppo_normalize_returns: false
  ppo_max_grad_norm: 0.5
  wm_epochs_per_cycle: 3
  # Fine-tune the same online WM on the complete single-environment P2E
  # dataset before handing it to planning; never restart from random weights.
  final_wm_epochs: 5
  show_wm_progress: false
  replay_buffer_size: 30000
  replay_add_ratio: 0.5
  salient_sample_ratio: 0.5


attention_model:
  env_type: ${domains.${domain}.env_type}
  use_bipedal_attention: ${domains.${domain}.use_bipedal_attention}
  data_type: ${domains.${domain}.wm_data_type} # 'norm' or 'discrete' 
  model_type: Attention       # Attention, Embedding, MLP
  grid_shape: ${domains.${domain}.grid_shape}
  attention_mask_size: ${domains.${domain}.attention_mask_size}
  batch_size: 1024  # larger batch → better GPU utilization
  n_cpu: 4  # 4 workers is enough; too many causes overhead
  embed_dim: 128  # 128 64/128/256
  num_heads: 1   # 1 if the embed_dim is 64, num_heads should better be 1
  data_dir: ${env.collect.data_save_path}
  # After training on data_dir, validate on this second dataset (set to null to skip)
  validation_data_dir: ${domains.${domain}.validation_data_dir}
  n_epochs: 10 # 30
  lr: 5e-4 # 1e-4 
  wd: 1e-5
  obs_norm_values: ${domains.${domain}.obs_norm_values}
  action_norm_values: ${domains.${domain}.action_norm_values}
  observation_schema: ${domains.${domain}.observation_schema}
  # Balance generic (action, state-changed) buckets. This teaches rare valid
  # interactions without encoding pickup/drop/toggle rules in the collector.
  transition_balanced_sampling: ${domains.${domain}.transition_balanced_sampling}
  # Cover the MiniGrid object/color vocabulary used by supported layouts.
  valid_values_obj: [1, 2, 3, 4, 5, 8, 10]
  valid_values_color: [0, 1, 2, 3, 4, 5]
  valid_values_state: [0, 1, 2, 3]
  # A single schema-driven observation objective is used in every domain.
  # Categorical, binary, continuous, and count fields are normalized first,
  # then averaged without domain-specific or rarity-specific multipliers.
  use_wandb: False
  enable_progress_bar: True
  log_every_n_steps: 10
  frame_stack: 1  # K=1 for deterministic Crafter (no need for temporal context)

  # freeze weights
  freeze_weight: False  # When true, load weights and skip further training.
  model_save_path: ${domains.${domain}.world_model_checkpoint}

  # plot
  visualization: False    # Disable WM visualizations
  visualize_every: 50
  save_path: ${oc.env:PROJECT_ROOT}/modelBased/visulization
  direction_map: {0: 'right', 1: 'down', 2: 'left', 3: 'up'}
  # Compact WM/PPO actions preserve historical IDs 0-4 and append drop as 5.
  # Native MiniGrid IDs are [0, 1, 2, 3, 5, 4]; only native done (6) is excluded.
  action_map: {0: 'left', 1: 'right', 2: 'forward', 3: 'pickup', 4: 'toggle', 5: 'drop'}
  lambda_ewc: 100         # EWC regularization strength
  ewc_ratio: 0.2           # Adaptive ratio target; set to `null` for manual control
  lambda_ema: 0.1
  lambda_ewc_min: 10
  lambda_ewc_max: 1.0e3
  scale_factor: 1.0
  drift_threshold: null     # Learned automatically during warmup when left unset
  warmup_steps: 100
  drift_cooldown: 200
  drift_hi: 1.10
  drift_lo: 0.70
  drift_up_step: 0.10
  drift_down_step: 0.05
  replay_frac: 0.5

# 2. data collection
env:
  # For Crafter collection, env_path is not used by CustomCrafterEnv.
  # Keep it for backward compatibility with MiniGrid scripts.
  env_path: ${domains.${domain}.layout_path}
  visualize: False
  env_type: ${domains.${domain}.env_type}
  max_steps: ${domains.${domain}.data_collection.max_steps}
  crafter:
    stochastic: False     # False = entities frozen (zombie/cow don't move)
    slippery_prob: 0.0     # 0.0 = fully deterministic for initial validation
  collect:
    data_type: ${domains.${domain}.data_collection.data_type} # uniform | random
    # During MiniGrid collection only, parse S as E for random starts. Policy
    # training still reads the original layout and uses S as its fixed start.
    replace_start_with_empty: ${oc.select:domains.${domain}.collection_replace_start_with_empty,false}
    uniform_reset_steps: ${domains.${domain}.data_collection.uniform_reset_steps}
    episodes: ${domains.${domain}.data_collection.episodes}
    mini_dataset_size: ${domains.${domain}.data_collection.mini_dataset_size}
    maximum_dataset_size: ${domains.${domain}.data_collection.maximum_dataset_size}
    data_save_path: ${domains.${domain}.data_save_path}
    save_coverage_visualize: False
    visualize_save_path: ${oc.env:PROJECT_ROOT}/outputs/dataset_visualization
    visualize_filename: ${domains.${domain}.visualize_filename}
    save_env_visualize: False
    env_visualize_save_path: ${oc.env:PROJECT_ROOT}/outputs/env_visualization
    env_visualize_filename: ${domains.${domain}.env_visualize_filename}

# 4. PPO model
PPO:
  # This is the only training-source switch. All PPO settings below are shared:
  # True = direct environment transitions; False = world-model transitions.
  train_in_real_env: False
  # Number of independent real Crafter environments used by PPO sampling.
  # Set to 1 to use the original serial collector.
  num_real_envs: 8
  real_env_backend: subprocess
  real_env_start_method: spawn
  action_set: a6_drop_inventory  # Six actions + colour-aware inventory observation; preserves older checkpoints.
  # Change this value for independent runs. It controls PPO initialization,
  # stochastic actions, and MiniGrid reset randomness in both real and WM modes.
  seed: 0
  env_type: ${domains.${domain}.env_type}
  has_continuous_action_space: False
  # Maximum actions before an unfinished episode resets. Increase this with
  # task size/complexity: 6x5=128-256, simple 11x11=512-1000,
  # key-door 11x11=1000-2000, 21x21=2000-4000. A useful rule is 5-10x the
  # shortest feasible solution length; avoid oversized values because random
  # walks can then achieve deceptively high MiniGrid rewards. Keep
  # rollout_steps roughly 2-4x max_ep_len so each PPO update sees multiple
  # episodes.
  max_ep_len: ${domains.${domain}.policy.max_ep_len}
  action_std: 0.1  # set same std for action distribution which was used while saving
  i_episode: 0
  K_epochs: 8  # update policy for K epochs
  eps_clip: 0.2  # clip parameter for PPO
  gamma: 0.99  # discount factor
  # Standard PPO rollout/update settings. A rollout spans multiple episodes;
  # never run eight optimizer epochs on a single 3- or 4-step episode.
  rollout_steps: ${domains.${domain}.policy.rollout_steps}
  # Number of GPU-batched imagined trajectories used only by WM training.
  # With rollout_steps=8192, 8 envs provide a full 1024-step trajectory per
  # PPO update, matching Crafter's episode horizon and improving sparse-reward
  # credit assignment. rollout_steps and max_training_timesteps must both be
  # divisible by this value.
  num_imagined_envs: ${oc.select:domains.${domain}.policy.num_imagined_envs,64}
  # Zero is the usual choice when deterministic argmax performance matters;
  # positive entropy explicitly rewards keeping the policy stochastic.
  entropy_coef: 0.001
  normalize_advantages: True
  normalize_returns: False
  max_grad_norm: 0.5
  step_penalty: 0.0  # Step penalty set to 0.0 (original reward already incorporates step decay)
  lr_actor: 0.0003  # learning rate for actor
  lr_critic: 0.001  # learning rate for critic
  # Leave null to select the matching source-specific path automatically.
  # A command-line PPO.checkpoint_path=... override still takes precedence.
  checkpoint_path: null
  checkpoint_dir: ${oc.env:MODEL_FPATH}/Policy
  checkpoint_path_real_env: ${oc.env:MODEL_FPATH}/Policy/policy_${domain}_${domains.${domain}.task_name}_realenv_seed${PPO.seed}.ckpt
  checkpoint_path_planning: ${oc.env:MODEL_FPATH}/Policy/policy_${domain}_${domains.${domain}.task_name}_seed${PPO.seed}.ckpt
  # Leave null to select the standard or continual WM path automatically.
  # run_pipeline.py passes the resolved path explicitly to policy training.
  checkpoint_path_wm: null
  compute_regret: False
  regret_eval_freq: 5000
  regret_eval_episodes: 5
  episodes_eval: 10
  wandb_project: minigrid_policy_training
  wandb_entity: null  # null uses the default entity from your `wandb login`
  # Runtime grouping is automatic and layout-specific. Planning preserves
  # <domain>_<task_name>_policy; real training uses
  # <domain>_<task_name>_realenv_policy. Each group contains its seed runs.
  rolling_window_episodes: 50  # WandB rolling metrics use the latest N episodes
  time_step: 0
  max_training_timesteps: ${domains.${domain}.policy.max_training_timesteps}
  action_std_decay_freq: 2.5e5
  action_std_decay_rate: 0.05
  min_action_std: 0.1
  save_model_freq: 1e4
  ########################################
  # test
  total_test_episodes: ${domains.${domain}.policy.total_test_episodes}
  render: False
  # False samples from the learned categorical policy. True uses actor argmax.
  test_deterministic: False
  render_delay: 0.05
  gif_fps: 10
  env_path: ${domains.${domain}.layout_path}
  visualize: false
  save_gif: True
  save_path_gif: ${oc.env:PROJECT_ROOT}/modelBased/visulization/PPO/PPO_gif
  save_csv: True
  save_path_csv: ${oc.env:PROJECT_ROOT}/modelBased/visulization/PPO/PPO_csv
  use_wandb: True

test_env:
  visualize: False
  time_limit: 256 #max number of steps for each rollout 600
  env_name: MiniGrid-Empty-8x8-v0 #MiniGrid-Dynamic-Obstacles-8x8-v0 #MiniGrid-Empty-5x5-v0 #MiniGrid-Empty-8x8-v0 #MiniGrid-Empty-Random-6x6-v0 
  n_rollouts: 1000

# 4. Rmax
R_max:
